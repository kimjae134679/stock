name: Dashboard Browser QA v0.5.7

on:
  push:
    branches: [main]
    paths:
      - 'public/reports/stable-v057.html'
      - 'public/assets/app-v*.css'
      - 'public/assets/app-v*.js'
      - 'public/data/ai-gems.json'
      - 'public/data/wave-cycles.json'
      - 'public/data/market-daily/**'
      - 'scripts/qa-dashboard-v57.mjs'
      - 'scripts/build-dashboard-bundle.mjs'
      - 'package.json'
      - '.github/workflows/dashboard-qa-v57.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-browser-qa-v57
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Publish QA run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.5.7",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v57-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/dashboard-qa-v57-latest.json
          git commit -m "Record dashboard v0.5.7 QA run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check public/assets/app-v44.js
          node --check public/assets/app-v56-gems.js
          node --check public/assets/app-v56-cycle-guard.js
          node --check public/assets/app-v56-cycle-final.js
          node --check public/assets/app-v57-reference.js
          node --check public/assets/app-v57-pivot-match.js
          node --check scripts/qa-dashboard-v57.mjs
          node --check scripts/build-dashboard-bundle.mjs
          npm run dashboard:bundle
          node --check public/assets/app-v57-bundle.js
          ! grep -q 'app-v56-cycle-final.js' public/assets/app-v57-bundle.js
          ! grep -q 'app-v57-cycle-tune.js' public/assets/app-v57-bundle.js
          grep -q 'Market Radar Daily · v0.5.7' public/reports/stable-v057.html
          grep -q 'MR057' public/reports/stable-v057.html
          grep -q 'app-v57-bundle.css' public/reports/stable-v057.html
          grep -q 'app-v57-bundle.js' public/reports/stable-v057.html
          grep -q '구조 점수' public/assets/app-v57-pivot-match.js
          grep -q '카드별 실제 범위로 자동 확대' public/assets/app-v57-pivot-match.js
          grep -q 'FUTURE_DAYS=126' public/assets/app-v57-pivot-match.js
          grep -q '현재 위치' public/assets/app-v57-pivot-match.js
          ! grep -q 'app-v46-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v47-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v48-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v49-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v50-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v51-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v51b-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v51c-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v52-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v53-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v54-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v56-enhance.js' public/reports/stable-v057.html
          ! grep -q 'app-v56-widecycle.js' public/reports/stable-v057.html
          grep -q 'stable-v057.html' public/app-live.html
          test -s public/data/wave-cycles.json
          test -s public/data/market-daily/QQQ.json
      - name: Start local site
        run: |
          cd public
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mr-http.log 2>&1 &
          sleep 2
      - name: Browser QA desktop + mobile
        run: npm run qa:v57
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v057-qa-screenshots
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark QA success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "0.5.7",\n  "run_id": %s,\n  "status": "success",\n  "checks": ["desktop", "mobile", "pair-local-axis", "tall-cycle-charts", "structure-score-breakdown", "score-order", "no-lookahead-copy", "price-cutoff", "flat-intraday-hidden", "cycle-first-order", "current-position-marker", "historical-future-126d", "future-outcomes", "bundled-assets", "ai-section", "load-collapse", "overflow"]\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v57-latest.json
          git add ops/dashboard-qa-v57-latest.json
          git commit -m "Mark dashboard v0.5.7 QA ${{ github.run_id }} successful" || true
          git push || true
