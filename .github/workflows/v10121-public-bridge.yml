name: v1.01.21 Public Bridge

on:
  push:
    branches: [ ops/v10121-public-bridge ]
    paths:
      - '.github/workflows/v10121-public-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/v10121-public-bridge
          fetch-depth: 1
      - name: Download canonical APK from signed release URL
        env:
          URL_B64: 
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          url=$(printf '%s' "$URL_B64" | base64 -d)
          curl -fL --retry 3 --retry-delay 2 "$url" -o handoff/PhoneLOL_v1.01.21.apk
          sha=$(sha256sum handoff/PhoneLOL_v1.01.21.apk | awk '{print $1}')
          size=$(stat -c%s handoff/PhoneLOL_v1.01.21.apk)
          echo "APK_SHA256=$sha"
          echo "APK_SIZE=$size"
          test "$sha" = 'f7347326aa088700e267133ff9d0e8c3a8bf3cc70871ed8120b17db7b32f2ffc'
          test "$size" = '103834935'
      - name: Commit temporary public bridge APK
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f handoff/PhoneLOL_v1.01.21.apk
          git commit -m 'ops: temporary v1.01.21 APK bridge'
          git push origin HEAD:ops/v10121-public-bridge
