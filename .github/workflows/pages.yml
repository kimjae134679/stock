name: Deploy Market Radar Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed dashboard
        run: |
          test -s public/reports/latest.html
          test -s public/assets/full-recovery-v22.js
          grep -q 'Market Radar Daily · v' public/reports/latest.html
          grep -q 'full-recovery-v22.js?v=' public/reports/latest.html
          node --check public/assets/full-recovery-v22.js
          echo 'Committed Market Radar dashboard verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload committed public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy committed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
