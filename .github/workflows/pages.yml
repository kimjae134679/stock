name: Deploy Market Radar and ChungYack Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'VERSION'
      - 'chungyack-apk/public/**'
      - 'chungyack-apk/data-parts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble combined Pages site
        shell: bash
        run: |
          rm -rf _pages-site
          mkdir -p _pages-site/chungyack/data
          cp -a public/. _pages-site/
          cp -a chungyack-apk/public/. _pages-site/chungyack/
          cat chungyack-apk/data-parts/*.csv > _pages-site/chungyack/data/sh-2026.csv
          test "$(wc -l < _pages-site/chungyack/data/sh-2026.csv)" -eq 80
          node -e "const a=require('./_pages-site/chungyack/data/app.json');if(a.trackingSeed?.length)throw new Error('public trackingSeed must be empty');const c=require('./_pages-site/chungyack/data/hourly-report.json');if(c.groups?.some(g=>g.id==='already-applied'))throw new Error('private applied group must not be public');"
          grep -q "chungyack.opportunity.hidden.v1" _pages-site/chungyack/assets/app-v7.js
          grep -q "networkFirst" _pages-site/chungyack/sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
