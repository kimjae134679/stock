name: Deploy Market Radar Pages

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'VERSION'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: market-radar-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify committed dashboard
        run: |
          test -s public/reports/latest.html
          test -s public/assets/full-recovery-v22.js
          test -s public/assets/evaluation-v26.js
          test -s public/assets/layout-v28.js
          test -s public/assets/returns-v29.js
          test -s public/assets/phase-status-v29.js
          test -s public/assets/ui-v30.css
          test -s public/assets/ui-v30.js
          test -s public/assets/app-runtime-v33.js
          test -s public/sw.js
          grep -q 'Market Radar Daily · v0.3.3' public/reports/latest.html
          grep -q "__MR_RELEASE='0.3.3'" public/reports/latest.html
          grep -q 'app-runtime-v33.js' public/reports/latest.html
          grep -q 'self.registration.unregister' public/sw.js
          node --check public/assets/full-recovery-v22.js
          node --check public/assets/evaluation-v26.js
          node --check public/assets/layout-v28.js
          node --check public/assets/returns-v29.js
          node --check public/assets/phase-status-v29.js
          node --check public/assets/ui-v30.js
          node --check public/assets/app-runtime-v33.js
          echo 'Committed Market Radar v0.3.3 dashboard verified.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload committed public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy committed dashboard
        id: deployment
        uses: actions/deploy-pages@v4
