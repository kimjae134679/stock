name: Dashboard Browser QA v0.4.8

on:
  push:
    branches: [main]
    paths:
      - 'public/reports/stable-v048.html'
      - 'public/assets/app-v48-enhance.js'
      - 'public/assets/app-v48.css'
      - 'public/assets/app-v47-enhance.js'
      - 'public/assets/app-v47.css'
      - 'public/assets/app-v46-enhance.js'
      - 'public/assets/app-v45-enhance.js'
      - 'public/assets/app-v44.js'
      - 'public/data/cycle-full.json'
      - 'scripts/qa-dashboard-v48.mjs'
      - 'package.json'
      - '.github/workflows/dashboard-qa-v48.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-browser-qa-v48
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Publish QA run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.4.8",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v48-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/dashboard-qa-v48-latest.json
          git commit -m "Record dashboard v0.4.8 QA run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check public/assets/app-v44.js
          node --check public/assets/app-v45-enhance.js
          node --check public/assets/app-v46-enhance.js
          node --check public/assets/app-v47-enhance.js
          node --check public/assets/app-v48-enhance.js
          node --check scripts/qa-dashboard-v48.mjs
          test -s public/reports/stable-v042-baseline.html
          test -s public/data/cycle-full.json
          grep -q 'Market Radar Daily · v0.4.8' public/reports/stable-v048.html
          grep -q 'MR048' public/reports/stable-v048.html
          grep -q 'app-v48-enhance.js' public/reports/stable-v048.html
          grep -q 'app-v48.css' public/reports/stable-v048.html
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('public/data/cycle-full.json','utf8'));
          const q=f.assets?.QQQ,reps=q?.representatives||[];
          if(!q||q.full_cycle_count<30) throw new Error('QQQ full-cycle count too low');
          if(!q.current_full?.path?.length) throw new Error('current path missing');
          if(reps.filter(x=>x.extended_path?.length>=4&&x.next_high_date).length<4) throw new Error('extended next-rise representatives missing');
          NODE
      - name: Start local site
        run: |
          cd public
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mr-http.log 2>&1 &
          sleep 2
      - name: Browser QA desktop + mobile
        run: npm run qa:v48
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v048-qa-screenshots
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark QA success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "0.4.8",\n  "run_id": %s,\n  "status": "success",\n  "checks": ["desktop", "mobile", "load-collapse", "thick-colored-shape-lines", "year-date-legend", "low-high-low-next-rise", "current-midpoint", "3-4-6-cycle-toggle", "v47-detail-preserved", "modal-v48", "blank-panel", "overflow"]\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v48-latest.json
          git add ops/dashboard-qa-v48-latest.json
          git commit -m "Mark dashboard v0.4.8 QA ${{ github.run_id }} successful" || true
          git push || true
# v0.4.8 explicit trigger
