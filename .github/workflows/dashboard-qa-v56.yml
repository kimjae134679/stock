name: Dashboard Browser QA v0.5.6

on:
  push:
    branches: [main]
    paths:
      - 'public/reports/stable-v056.html'
      - 'public/assets/app-v54.css'
      - 'public/assets/app-v54-enhance.js'
      - 'public/assets/app-v55.css'
      - 'public/assets/app-v56.css'
      - 'public/assets/app-v56-enhance.js'
      - 'public/assets/app-v56-widecycle.css'
      - 'public/assets/app-v56-widecycle.js'
      - 'public/data/ai-gems.json'
      - 'public/data/wave-cycles.json'
      - 'public/data/market-daily/**'
      - 'scripts/qa-dashboard-v56.mjs'
      - 'package.json'
      - '.github/workflows/dashboard-qa-v56.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-browser-qa-v56
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Publish QA run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.5.6",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v56-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/dashboard-qa-v56-latest.json
          git commit -m "Record dashboard v0.5.6 QA run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check public/assets/app-v54-enhance.js
          node --check public/assets/app-v56-enhance.js
          node --check public/assets/app-v56-widecycle.js
          node --check scripts/qa-dashboard-v56.mjs
          grep -q 'Market Radar Daily · v0.5.6' public/reports/stable-v056.html
          grep -q 'MR056' public/reports/stable-v056.html
          grep -q 'app-v56.css' public/reports/stable-v056.html
          grep -q 'app-v56-enhance.js' public/reports/stable-v056.html
          grep -q 'app-v56-widecycle.css' public/reports/stable-v056.html
          grep -q 'app-v56-widecycle.js' public/reports/stable-v056.html
          grep -q 'AI 알짜 추적 후보' public/data/ai-gems.json
          grep -q 'SK하이닉스' public/data/ai-gems.json
          grep -q 'HD현대일렉트릭' public/data/ai-gems.json
          grep -q 'Vertiv' public/data/ai-gems.json
          test -s public/data/wave-cycles.json
          test -s public/data/market-daily/QQQ.json
          test -s public/reports/stable-v051-baseline.html
          test -s public/reports/stable-v042-baseline.html
      - name: Start local site
        run: |
          cd public
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mr-http.log 2>&1 &
          sleep 2
      - name: Browser QA desktop + mobile
        run: npm run qa:v56
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v056-qa-screenshots
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark QA success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "0.5.6",\n  "run_id": %s,\n  "status": "success",\n  "checks": ["desktop", "mobile", "dark-stock-chart", "all-five-cycle-previews", "wide-past-window", "wide-future-side-history", "current-overlay", "restored-overlay", "restored-one-to-one", "ai-gems-us", "ai-gems-korea", "ai-filter", "korean-ticker-modal", "load-collapse", "overflow"],\n  "known_good_backup": "backup/v0.5.1-known-good@94eccb7"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v56-latest.json
          git add ops/dashboard-qa-v56-latest.json
          git commit -m "Mark dashboard v0.5.6 QA ${{ github.run_id }} successful" || true
          git push || true
