name: Dashboard Browser QA v0.5.8

on:
  push:
    branches: [main]
    paths:
      - 'public/reports/stable-v058.html'
      - 'public/assets/cycle-future-v58.css'
      - 'public/assets/cycle-future-v58.js'
      - 'public/app-live.html'
      - 'public/index.html'
      - 'public/data/ai-gems.json'
      - 'public/data/wave-cycles.json'
      - 'public/data/market-daily/**'
      - 'scripts/qa-dashboard-v58.mjs'
      - 'VERSION'
      - '.github/workflows/dashboard-qa-v58.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-browser-qa-v58
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Publish QA run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.5.8",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v58-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/dashboard-qa-v58-latest.json
          git commit -m "Record dashboard v0.5.8 QA run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check public/assets/app-v44.js
          node --check public/assets/app-v56-gems.js
          node --check public/assets/cycle-future-v58.js
          node --check scripts/qa-dashboard-v58.mjs
          grep -q 'Market Radar Daily · v0.5.8' public/reports/stable-v058.html
          grep -q 'MR058' public/reports/stable-v058.html
          grep -q 'cycle-future-v58.css' public/reports/stable-v058.html
          grep -q 'cycle-future-v58.js' public/reports/stable-v058.html
          grep -q 'FUTURE_DAYS=126' public/assets/cycle-future-v58.js
          grep -q 'data-score-lookahead="0"' public/assets/cycle-future-v58.js
          grep -q '점수 계산에 0% 사용' public/assets/cycle-future-v58.js
          grep -q 'stable-v058.html' public/app-live.html
          test "$(tr -d '\r\n ' < VERSION)" = '0.5.8'
          test -s public/data/wave-cycles.json
          test -s public/data/market-daily/QQQ.json
      - name: Start local site
        run: |
          cd public
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mr-http.log 2>&1 &
          sleep 2
      - name: Browser QA desktop + mobile
        run: node scripts/qa-dashboard-v58.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v058-qa-screenshots
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark QA success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "0.5.8",\n  "run_id": %s,\n  "status": "success",\n  "checks": ["desktop", "mobile", "current-marker", "history-continues-126-bars", "1-3-6-month-markers", "no-lookahead-score", "504-day-detail", "large-labels", "dark-chart", "ai-section", "load-collapse", "overflow"]\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v58-latest.json
          git add ops/dashboard-qa-v58-latest.json
          git commit -m "Mark dashboard v0.5.8 QA ${{ github.run_id }} successful" || true
          git push || true
