name: Dashboard Browser QA v0.5.1B

on:
  push:
    branches: [main]
    paths:
      - 'public/reports/stable-v051.html'
      - 'public/assets/app-v51b-enhance.js'
      - 'public/assets/app-v51b.css'
      - 'scripts/qa-dashboard-v51b.mjs'
      - '.github/workflows/dashboard-qa-v51b.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-browser-qa-v51b
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Publish QA run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.5.1B",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v51b-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/dashboard-qa-v51b-latest.json
          git commit -m "Record dashboard v0.5.1B QA run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Static checks
        run: |
          node --check public/assets/app-v51b-enhance.js
          node --check scripts/qa-dashboard-v51b.mjs
          grep -q 'MR051B' public/reports/stable-v051.html
          grep -q 'app-v51b-enhance.js' public/reports/stable-v051.html
          grep -q 'app-v51b.css' public/reports/stable-v051.html
          test -s public/reports/stable-v050-baseline.html
      - name: Start local site
        run: |
          cd public
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mr-http.log 2>&1 &
          sleep 2
      - name: Browser QA desktop + mobile
        run: node scripts/qa-dashboard-v51b.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-v051b-qa-screenshots
          path: qa-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 30
      - name: Mark QA success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          printf '{\n  "version": "0.5.1B",\n  "run_id": %s,\n  "status": "success",\n  "checks": ["desktop", "mobile", "five-overlaid-history-lines", "current-and-history-together", "central-pivot-average-alignment", "previous-peak-explicit", "pair-current-plus-one-history", "pinch-zoom", "load-collapse", "overflow"],\n  "apk_rebuild": false,\n  "stable_baseline": "v0.5.0"\n}\n' "${{ github.run_id }}" > ops/dashboard-qa-v51b-latest.json
          git add ops/dashboard-qa-v51b-latest.json
          git commit -m "Mark dashboard v0.5.1B QA ${{ github.run_id }} successful" || true
          git push || true
