name: Build ChungYack Radar Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'chungyack-apk/**'
      - '.github/workflows/chungyack-android.yml'
  push:
    branches: [main]
    paths:
      - 'chungyack-apk/**'
      - '.github/workflows/chungyack-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chungyack-radar-android-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Assemble sanitized public SH catalog
        run: |
          cd chungyack-apk
          mkdir -p public/data
          cat data-parts/*.csv > public/data/sh-2026.csv
          test "$(wc -l < public/data/sh-2026.csv)" -eq 80

      - name: Privacy and data QA
        run: |
          cd chungyack-apk
          node -e "const x=require('./public/data/app.json'); if(x.trackingSeed.length) throw new Error('public trackingSeed must be empty'); if(x.summary.catalog!==79) throw new Error('catalog count metadata'); if(x.version!=='0.4.1') throw new Error('app version');"
          node -e "const r=require('./public/data/hourly-report.json'); if(!r.groups?.length) throw new Error('public report groups empty'); if(!r.megaNotices?.length) throw new Error('mega notice missing'); const n=r.groups.flatMap(g=>g.items||[]).length; if(n<10) throw new Error('too few public notices '+n);"
          test "$(tail -n +2 public/data/sh-2026.csv | wc -l)" -eq 79
          grep -q ',29,' public/data/sh-2026.csv
          grep -q ',39,' public/data/sh-2026.csv
          grep -q ',46,' public/data/sh-2026.csv
          grep -q ',49,' public/data/sh-2026.csv
          grep -q ',59,' public/data/sh-2026.csv
          grep -q '마곡지구 마곡엠밸리' public/data/sh-2026.csv
          ! grep -R -E '김재원|011016|예비 80번대|소득 1순위|지역 2순위' public data-parts 2>/dev/null
          grep -q '수백·수천호' public/index.html
          grep -q 'data-page="mega"' public/index.html
          grep -q 'publicScheduleGroups' public/index.html
          grep -q 'app-v4-ui.css' public/index.html
          grep -q 'app-v4-ui.js' public/index.html
          grep -q 'hourly-report.json' public/assets/app-v4.js
          grep -q '현재 회차 경쟁률' public/assets/app-v4.js
          grep -q 'raw.githubusercontent.com/kimjae134679/stock/main' public/assets/app-v4-remote.js
          grep -q 'repeat(5,minmax(0,1fr))' public/assets/app-v4-ui.css
          grep -q 'overflow-x:clip' public/assets/app-v4-ui.css
          grep -q 'backdrop-filter:none' public/assets/app-v4-ui.css
          grep -q 'p.hidden=!on' public/assets/app-v4-ui.js
          grep -q 'window.scrollTo(0,0)' public/assets/app-v4-ui.js
          grep -q '최근 제거 복원' public/assets/app-v3.js
          grep -q 'chungyack-local-backup-v1' public/assets/app-v3.js
          node --check public/assets/app.js
          node --check public/assets/app-v2-fixes.js
          node --check public/assets/app-v3.js
          node --check public/assets/app-v4.js
          node --check public/assets/app-v4-remote.js
          node --check public/assets/app-v4-ui.js
          node --check public/sw.js
          node --check scripts/apply-android-branding.mjs

      - name: Install dependencies
        run: cd chungyack-apk && npm install --no-audit --no-fund

      - name: Create and sync Android project
        run: |
          cd chungyack-apk
          npx cap add android
          npx cap sync android
          npm run android:brand

      - name: Verify Android app shell
        run: |
          cd chungyack-apk
          test -s android/app/src/main/res/drawable/chungyack_icon_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q '__CY_HANDLE_NATIVE_BACK__' android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q '앱을 종료하시겠습니까' android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q 'app-v4.js' android/app/src/main/assets/public/index.html
          grep -q 'app-v4-remote.js' android/app/src/main/assets/public/index.html
          grep -q 'app-v4-ui.js' android/app/src/main/assets/public/index.html
          grep -q 'app-v4-ui.css' android/app/src/main/assets/public/index.html
          grep -q '대형공고' android/app/src/main/assets/public/index.html

      - name: Restore persistent ChungYack signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chungyack-radar-debug-keystore-v1

      - name: Build debug APK
        run: |
          cd chungyack-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK
        run: |
          VERSION=$(tr -d '\r\n ' < chungyack-apk/VERSION)
          cp chungyack-apk/android/app/build/outputs/apk/debug/app-debug.apk "ChungYack-Radar-v${VERSION}-debug.apk"
          test -s "ChungYack-Radar-v${VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChungYack-Radar-v0.4.1-debug-apk
          path: ChungYack-Radar-v0.4.1-debug.apk
          retention-days: 90

      - name: Publish APK release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '\r\n ' < chungyack-apk/VERSION)
          TAG="chungyack-apk-v${VERSION}"
          APK="ChungYack-Radar-v${VERSION}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "청약 레이더 v${VERSION}" --notes "Android WebView 모바일 QA 수정. 화면 가로 잘림, 탭 전환 후 이전 화면 잔상, 하단 5개 메뉴 폭 흔들림, 상태바 겹침을 방지하고 일반 공고/일정/대형공고/추적/설정 화면을 완전히 분리합니다. 공고 데이터·SH 79개 상세·개인 로컬 추적 구조는 유지합니다."
          gh release upload "$TAG" "$APK" --clobber
