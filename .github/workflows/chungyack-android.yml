name: Build ChungYack Stable Remote Shell APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'chungyack-apk/VERSION'
      - 'chungyack-apk/package.json'
      - 'chungyack-apk/capacitor.config.json'
      - 'chungyack-apk/scripts/apply-android-branding.mjs'
      - 'chungyack-apk/rebuild-shell.request'
      - '.github/workflows/chungyack-android.yml'
  push:
    branches: [main]
    paths:
      - 'chungyack-apk/VERSION'
      - 'chungyack-apk/package.json'
      - 'chungyack-apk/capacitor.config.json'
      - 'chungyack-apk/scripts/apply-android-branding.mjs'
      - 'chungyack-apk/rebuild-shell.request'
      - '.github/workflows/chungyack-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chungyack-stable-shell-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < chungyack-apk/VERSION)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Verify remote-shell contract
        shell: bash
        run: |
          cd chungyack-apk
          node -e "const c=require('./capacitor.config.json');if(c.server?.url!=='https://kimjae134679.github.io/stock/chungyack/')throw new Error('remote URL mismatch');if(c.appId!=='com.kimjae134679.chungyack')throw new Error('app id mismatch');const p=require('./package.json');const v=require('fs').readFileSync('VERSION','utf8').trim();if(p.version!==v)throw new Error('version mismatch');"
          node -e "const a=require('./public/data/app.json');if(a.trackingSeed?.length)throw new Error('public trackingSeed must be empty');const r=require('./public/data/hourly-report.json');if(r.groups?.some(g=>g.id==='already-applied'))throw new Error('private applied group must not be public');"
          node --check public/assets/app.js
          node --check public/assets/app-v2-fixes.js
          node --check public/assets/app-v3.js
          node --check public/assets/app-v4.js
          node --check public/assets/app-v5.js
          node --check public/assets/app-v6.js
          node --check public/assets/app-v61.js
          node --check public/assets/app-v7.js
          node --check public/sw.js
          node --check scripts/apply-android-branding.mjs
          grep -q "CY_V7_SAVED_KEY" public/assets/app-v7.js
          grep -q "CY_V7_HIDDEN_KEY" public/assets/app-v7.js
          grep -q "networkFirst" public/sw.js

      - name: Install dependencies
        run: cd chungyack-apk && npm install --no-audit --no-fund

      - name: Create stable Android shell
        run: |
          cd chungyack-apk
          npx cap add android
          npx cap sync android
          npm run android:brand

      - name: Verify Android shell
        shell: bash
        run: |
          cd chungyack-apk
          grep -q '청약 레이더' android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q '__CY_HANDLE_NATIVE_BACK__' android/app/src/main/java/com/kimjae134679/chungyack/MainActivity.java
          grep -q 'https://kimjae134679.github.io/stock/chungyack/' android/app/src/main/assets/capacitor.config.json
          grep -q 'app-v7.js' android/app/src/main/assets/public/index.html

      - name: Restore persistent ChungYack signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chungyack-radar-debug-keystore-v1

      - name: Build debug APK
        run: |
          cd chungyack-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Package APK
        shell: bash
        run: cp chungyack-apk/android/app/build/outputs/apk/debug/app-debug.apk "ChungYack-Radar-Live-Shell-v${{ steps.ver.outputs.version }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ChungYack-Radar-Live-Shell-v${{ steps.ver.outputs.version }}
          path: ChungYack-Radar-Live-Shell-v${{ steps.ver.outputs.version }}.apk
          retention-days: 90

      - name: Publish stable shell release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="chungyack-live-shell-v${{ steps.ver.outputs.version }}"
          APK="ChungYack-Radar-Live-Shell-v${{ steps.ver.outputs.version }}.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "청약 레이더 라이브 셸 v${{ steps.ver.outputs.version }}" --notes "한 번 설치하는 원격 HTML 셸입니다. 이후 HTML·공고 수정은 APK 재설치 없이 반영되고, 저장·숨김·신청추적 상태는 기기에 유지됩니다."
          gh release upload "$TAG" "$APK" --clobber
