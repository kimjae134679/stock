name: Update Market Radar Cycle History

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-cycle-history.mjs'
      - 'scripts/build-cycle-full.mjs'
      - '.github/workflows/cycle-history.yml'
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-radar-cycle-history
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish cycle run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.4.6",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cycle-history-latest.json
          git commit -m "Record cycle-history run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build historical swing data
        run: node scripts/build-cycle-history.mjs
      - name: Build detailed full-cycle paths
        run: node scripts/build-cycle-full.mjs
      - name: Validate cycle datasets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('public/data/cycle-history.json','utf8'));
          const f=JSON.parse(fs.readFileSync('public/data/cycle-full.json','utf8'));
          if(!j.assets?.QQQ?.current) throw new Error('QQQ current swing missing');
          if(!Array.isArray(j.assets.QQQ.history)||j.assets.QQQ.history.length<4) throw new Error('QQQ swings insufficient');
          if(!f.assets?.QQQ?.current_full?.path?.length) throw new Error('QQQ current full path missing');
          if(!Array.isArray(f.assets.QQQ.representatives)||f.assets.QQQ.representatives.length<6) throw new Error('QQQ representative cycles insufficient');
          if(!f.assets.QQQ.representatives.every(x=>Array.isArray(x.path)&&x.path.length>=3)) throw new Error('QQQ representative path missing');
          if(!f.assets.QQQ.representatives.every(x=>x.start_date&&x.high_date&&x.end_date)) throw new Error('QQQ turning dates missing');
          const bytes=fs.statSync('public/data/cycle-history.json').size+fs.statSync('public/data/cycle-full.json').size;
          if(bytes>9_000_000) throw new Error('combined cycle payload too large: '+bytes);
          console.log('cycle assets',Object.keys(j.assets||{}).length,'full assets',Object.keys(f.assets||{}).length,'bytes',bytes);
          NODE
      - name: Commit cycle datasets and success pointer
        run: |
          git pull --rebase --autostash || true
          mkdir -p ops
          ASSETS=$(node -e "const j=require('./public/data/cycle-history.json');process.stdout.write(String(Object.keys(j.assets||{}).length))")
          FULL=$(node -e "const j=require('./public/data/cycle-full.json');process.stdout.write(String(Object.keys(j.assets||{}).length))")
          ERRORS=$(node -e "const j=require('./public/data/cycle-full.json');process.stdout.write(String(Object.keys(j.errors||{}).length))")
          BYTES=$(($(wc -c < public/data/cycle-history.json)+$(wc -c < public/data/cycle-full.json)))
          printf '{\n  "version": "0.4.6",\n  "run_id": %s,\n  "status": "success",\n  "assets": %s,\n  "full_assets": %s,\n  "errors": %s,\n  "combined_bytes": %s\n}\n' "${{ github.run_id }}" "$ASSETS" "$FULL" "$ERRORS" "$BYTES" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/cycle-history.json public/data/cycle-full.json ops/cycle-history-latest.json
          git commit -m 'data: refresh detailed full historical cycles' || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark cycle build failed
        if: failure()
        run: |
          git pull --rebase --autostash || true
          mkdir -p ops
          printf '{\n  "version": "0.4.6",\n  "run_id": %s,\n  "status": "failed"\n}\n' "${{ github.run_id }}" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cycle-history-latest.json
          git commit -m "Mark cycle-history run ${{ github.run_id }} failed" || true
          git push || true
