name: Update Market Radar Cycle History

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-cycle-history.mjs'
      - '.github/workflows/cycle-history.yml'
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-radar-cycle-history
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build historical cycle data
        run: node scripts/build-cycle-history.mjs
      - name: Validate visual cycle dataset
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('public/data/cycle-history.json','utf8'));
          if(!j.assets?.QQQ?.current) throw new Error('QQQ current cycle missing');
          if(!Array.isArray(j.assets.QQQ.current.path) || j.assets.QQQ.current.path.length<2) throw new Error('QQQ current path missing');
          if(!Array.isArray(j.assets.QQQ.history) || j.assets.QQQ.history.length<4) throw new Error('QQQ historical swings insufficient');
          if(Object.keys(j.assets||{}).length<5) throw new Error('too few cycle assets');
          console.log('cycle assets',Object.keys(j.assets).length,'errors',Object.keys(j.errors||{}).length);
          NODE
      - name: Commit cycle history if changed
        run: |
          if git diff --quiet -- public/data/cycle-history.json; then
            echo 'No cycle-history change.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git pull --rebase --autostash || true
            git add public/data/cycle-history.json
            git commit -m 'data: refresh historical cycle durations and paths'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
