name: Update Market Radar Cycle History

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build-cycle-history.mjs'
      - 'scripts/build-cycle-full.mjs'
      - 'scripts/build-wave-cycles.mjs'
      - 'scripts/filter-wave-history.mjs'
      - '.github/workflows/cycle-history.yml'
  schedule:
    - cron: '20 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-radar-cycle-history
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Publish cycle run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "0.5.0",\n  "run_id": %s,\n  "status": "building"\n}\n' "${{ github.run_id }}" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cycle-history-latest.json
          git commit -m "Record cycle-history run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build historical swing data
        run: node scripts/build-cycle-history.mjs
      - name: Build detailed full-cycle paths
        run: node scripts/build-cycle-full.mjs
      - name: Build fixed multi-leg wave templates
        run: node scripts/build-wave-cycles.mjs
      - name: Exclude templates overlapping current context
        run: node scripts/filter-wave-history.mjs
      - name: Validate cycle datasets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('public/data/cycle-history.json','utf8'));
          const f=JSON.parse(fs.readFileSync('public/data/cycle-full.json','utf8'));
          const w=JSON.parse(fs.readFileSync('public/data/wave-cycles.json','utf8'));
          if(!j.assets?.QQQ?.current) throw new Error('QQQ current swing missing');
          if(!f.assets?.QQQ?.current_full?.path?.length) throw new Error('QQQ current full path missing');
          if(!w.assets?.QQQ?.current_context?.path?.length) throw new Error('QQQ wave context missing');
          if(!w.assets.QQQ.current_context.recent_drop) throw new Error('QQQ recent drop context missing');
          const reps=w.assets.QQQ.representatives||[];
          if(reps.length<5) throw new Error('QQQ historical wave templates insufficient');
          if(!reps.every(x=>Array.isArray(x.path)&&x.path.length>=5&&x.pivots?.length===5)) throw new Error('QQQ fixed wave path/pivots missing');
          if(reps.some(x=>String(x.second_low_date)>=String(w.assets.QQQ.current_context.start_date))) throw new Error('QQQ template overlaps current context');
          const bytes=fs.statSync('public/data/cycle-history.json').size+fs.statSync('public/data/cycle-full.json').size+fs.statSync('public/data/wave-cycles.json').size;
          if(bytes>13_000_000) throw new Error('combined cycle payload too large: '+bytes);
          console.log('cycle assets',Object.keys(j.assets||{}).length,'full assets',Object.keys(f.assets||{}).length,'wave assets',Object.keys(w.assets||{}).length,'QQQ historical templates',reps.length,'current',w.assets.QQQ.current_context.stage,'bytes',bytes);
          NODE
      - name: Commit cycle datasets and success pointer
        run: |
          git pull --rebase --autostash || true
          mkdir -p ops
          ASSETS=$(node -e "const j=require('./public/data/cycle-history.json');process.stdout.write(String(Object.keys(j.assets||{}).length))")
          FULL=$(node -e "const j=require('./public/data/cycle-full.json');process.stdout.write(String(Object.keys(j.assets||{}).length))")
          WAVE=$(node -e "const j=require('./public/data/wave-cycles.json');process.stdout.write(String(Object.keys(j.assets||{}).length))")
          ERRORS=$(node -e "const j=require('./public/data/wave-cycles.json');process.stdout.write(String(Object.keys(j.errors||{}).length))")
          WINDOWS=$(node -e "const j=require('./public/data/wave-cycles.json');process.stdout.write(String((j.assets?.QQQ?.representatives||[]).length))")
          BYTES=$(($(wc -c < public/data/cycle-history.json)+$(wc -c < public/data/cycle-full.json)+$(wc -c < public/data/wave-cycles.json)))
          printf '{\n  "version": "0.5.0",\n  "run_id": %s,\n  "status": "success",\n  "assets": %s,\n  "full_assets": %s,\n  "wave_assets": %s,\n  "errors": %s,\n  "qqq_wave_templates": %s,\n  "combined_bytes": %s\n}\n' "${{ github.run_id }}" "$ASSETS" "$FULL" "$WAVE" "$ERRORS" "$WINDOWS" "$BYTES" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/cycle-history.json public/data/cycle-full.json public/data/wave-cycles.json ops/cycle-history-latest.json
          git commit -m 'data: refresh non-overlapping historical wave templates' || true
          git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark cycle build failed
        if: failure()
        run: |
          git pull --rebase --autostash || true
          mkdir -p ops
          printf '{\n  "version": "0.5.0",\n  "run_id": %s,\n  "status": "failed"\n}\n' "${{ github.run_id }}" > ops/cycle-history-latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/cycle-history-latest.json
          git commit -m "Mark cycle-history run ${{ github.run_id }} failed" || true
          git push || true
