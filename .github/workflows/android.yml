name: Build Market Radar Android APK

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'capacitor.config.json'
      - 'public/index.html'
      - 'public/app-live.html'
      - 'public/reports/latest.html'
      - 'public/reports/stable-v036.html'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/assets/**'
      - 'scripts/apply-android-branding.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Basic dashboard checks
        run: |
          test -s public/app-live.html
          test -s public/reports/stable-v036.html
          test -s public/assets/app-runtime-v36.js
          test -s public/assets/layout-v36.js
          test -s public/assets/returns-v36.js
          grep -q 'Market Radar Daily · v0.3.6' public/reports/stable-v036.html
          grep -q '00.001%' public/reports/stable-v036.html
          grep -q 'app-live.html' public/index.html
          grep -q 'allowNavigation' capacitor.config.json
          node --check public/assets/app-runtime-v36.js
          node --check public/assets/layout-v36.js
          node --check public/assets/returns-v36.js
          node --check scripts/apply-android-branding.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply icon and native Back fallback
        run: node scripts/apply-android-branding.mjs
      - name: Verify native Back fallback
        run: |
          test -s android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '앱을 종료하시겠습니까' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '__MR_HANDLE_NATIVE_BACK__' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-v${{ steps.ver.outputs.version }}-debug-apk
          path: MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Market Radar $TAG" --notes "Market Radar Android debug APK. v0.3.6+ uses the permanent online app-live entry so market/UI updates can be received without rebuilding the APK for every web change."
          gh release upload "$TAG" "$APK" --clobber
