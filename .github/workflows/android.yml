name: Build Market Radar Android APK

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'capacitor.config.json'
      - 'public/index.html'
      - 'public/reports/latest.html'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/assets/**'
      - 'scripts/apply-android-branding.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify committed dashboard
        run: |
          test -s public/reports/latest.html
          test -s public/assets/app-back-v31.js
          test -s public/assets/ui-v30.css
          test -s public/assets/ui-v30.js
          node --check public/assets/app-back-v31.js
          node --check public/assets/ui-v30.js
          node --check scripts/apply-android-branding.mjs
          grep -q 'Market Radar Daily · v0.3.1' public/reports/latest.html
          grep -q 'app-back-v31.js?v=31' public/reports/latest.html
          echo 'Committed v0.3.1 dashboard verified.'

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web assets and native plugins
        run: npx cap sync android

      - name: Apply minimal launcher icon
        run: node scripts/apply-android-branding.mjs

      - name: Verify Android back plugin and icon resources
        run: |
          test -s android/app/src/main/res/drawable/market_radar_icon_foreground.xml
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -R "capacitor-app" -n android/app/src/main android/app/build.gradle* android/capacitor.settings.gradle >/dev/null || true

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-v${{ steps.ver.outputs.version }}-debug-apk
          path: MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90
