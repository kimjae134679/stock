name: Build Market Radar Android APK

on:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'scripts/apply-android-branding.mjs'
      - 'android/**'
      - 'ops/android-rebuild.request'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Publish build run pointer
        run: |
          mkdir -p ops
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "building",\n  "artifact": "MarketRadar-v%s-debug-apk"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" > ops/android-latest-run.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ops/android-latest-run.json
          git commit -m "Record Android build run ${{ github.run_id }}" || true
          git push || true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Standalone dashboard checks
        run: |
          test -s public/app-live.html
          test -s public/reports/stable-v051.html
          test -s public/reports/stable-v050-baseline.html
          test -s public/reports/stable-v042-baseline.html
          test -s public/assets/app-v44.js
          test -s public/assets/app-v49-modal-bridge.js
          test -s public/assets/app-v50-enhance.js
          test -s public/assets/app-v51-enhance.js
          test -s public/assets/app-v51.css
          test -s public/data/cycle-history.json
          test -s public/data/cycle-full.json
          test -s public/data/wave-cycles.json
          grep -q 'Market Radar Daily · v0.5.1' public/reports/stable-v051.html
          grep -q 'app-v51-enhance.js' public/reports/stable-v051.html
          grep -q 'stable-v051.html' public/app-live.html
          grep -q 'allowNavigation' capacitor.config.json
          ! grep -q 'full-recovery-v22.js' public/reports/stable-v051.html
          ! grep -q 'evaluation-v26.js' public/reports/stable-v051.html
          ! grep -q 'flow-guard' public/reports/stable-v051.html
          ! grep -q 'integrity-v' public/reports/stable-v051.html
          node --check public/assets/app-v44.js
          node --check public/assets/app-v50-enhance.js
          node --check public/assets/app-v51-enhance.js
          node --check scripts/apply-android-branding.mjs
          node - <<'NODE'
          const fs=require('fs');
          const w=JSON.parse(fs.readFileSync('public/data/wave-cycles.json','utf8'));
          const q=w.assets?.QQQ;
          if(!q?.current_context?.segments?.length) throw new Error('QQQ current active leg missing');
          if((q.representatives||[]).length<5) throw new Error('QQQ historical wave templates missing');
          if(!q.representatives.every(x=>x.pivots?.length===5&&x.legs?.length===4)) throw new Error('historical context legs missing');
          NODE
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply icon and native Back fallback
        run: node scripts/apply-android-branding.mjs
      - name: Verify native Back fallback
        run: |
          test -s android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '앱을 종료하시겠습니까' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '__MR_HANDLE_NATIVE_BACK__' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: market-radar-debug-keystore-v1
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-v${{ steps.ver.outputs.version }}-debug-apk
          path: MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90
      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          APK="MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Market Radar $TAG" --notes "Android-native rebuild. Web-only UI changes no longer trigger APK builds."
          gh release upload "$TAG" "$APK" --clobber
      - name: Mark build success
        if: success()
        run: |
          git pull --rebase || true
          mkdir -p ops
          CYCLE_BYTES=$(($(wc -c < public/data/cycle-history.json)+$(wc -c < public/data/cycle-full.json)+$(wc -c < public/data/wave-cycles.json)))
          printf '{\n  "version": "%s",\n  "run_id": %s,\n  "status": "success",\n  "artifact": "MarketRadar-v%s-debug-apk",\n  "release_tag": "v%s",\n  "cycle_bytes": %s,\n  "stable_baseline": "v0.5.0",\n  "signing_cache": "market-radar-debug-keystore-v1"\n}\n' "${{ steps.ver.outputs.version }}" "${{ github.run_id }}" "${{ steps.ver.outputs.version }}" "${{ steps.ver.outputs.version }}" "$CYCLE_BYTES" > ops/android-latest-run.json
          git add ops/android-latest-run.json
          git commit -m "Mark Android build ${{ github.run_id }} successful" || true
          git push || true
