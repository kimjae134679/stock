name: Build Market Radar Android APK

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'package.json'
      - 'capacitor.config.json'
      - 'public/index.html'
      - 'public/reports/latest.html'
      - 'public/reports/stable-v034.html'
      - 'public/manifest.webmanifest'
      - 'public/sw.js'
      - 'public/assets/**'
      - 'scripts/apply-android-branding.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: ver
        shell: bash
        run: echo "version=$(tr -d '\r\n ' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - name: Basic dashboard checks
        run: |
          test -s public/reports/stable-v034.html
          test -s public/assets/app-runtime-v34.js
          test -s public/assets/cycle-history-v34.js
          grep -q 'Market Radar Daily · v0.3.4' public/reports/stable-v034.html
          node --check public/assets/app-runtime-v34.js
          node --check public/assets/cycle-history-v34.js
          node --check scripts/apply-android-branding.mjs
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply icon and native Back fallback
        run: node scripts/apply-android-branding.mjs
      - name: Verify native Back fallback
        run: |
          test -s android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '앱을 종료하시겠습니까' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
          grep -q '__MR_HANDLE_NATIVE_BACK__' android/app/src/main/java/com/kimjae134679/marketradar/MainActivity.java
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: MarketRadar-v${{ steps.ver.outputs.version }}-debug-apk
          path: MarketRadar-v${{ steps.ver.outputs.version }}-debug.apk
          retention-days: 90
