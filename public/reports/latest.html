<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Market Radar Daily v0.2.4</title><link rel="stylesheet" href="../assets/report.css?v=24"><link rel="stylesheet" href="../assets/mobile-fixes.css?v=24"><style>html,body{overflow-x:hidden!important}.w{max-width:1480px}.fold-panel{border:1px solid #2a3c50;border-radius:18px;padding:14px;margin:16px 0;background:#0a141f}.fold-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid #243548;padding-bottom:10px;margin-bottom:12px}.fold-head h2{margin:0;flex:1}.fold-btn{border:1px solid #3d5570;background:#142335;color:#e8f4ff;border-radius:999px;padding:7px 12px;font-weight:850;cursor:pointer}.is-folded .fold-body{display:none}.is-folded .fold-head{border-bottom:0;margin-bottom:0;padding-bottom:0}.cardgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theme-card,.ticker-card{color:inherit;text-align:left;cursor:pointer}.theme-card small,.ticker-card small,.pick-row small{display:block;color:#9fb2c6;margin-top:4px}.theme-card em{display:block;color:#f6d46b;font-style:normal;margin-top:8px}.pick-row{display:grid;grid-template-columns:minmax(220px,1.4fr) minmax(220px,2fr) 60px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #203448;cursor:pointer}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ticker-chip{display:flex;flex-direction:column;align-items:flex-start;background:#101e2c;color:#eaf2fb;border:1px solid #35506a;border-radius:12px;padding:9px 11px;cursor:pointer}.ticker-chip span{font-size:11px;color:#9fb2c6}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #203448;text-align:left}.endmark{text-align:center;color:#7dd3fc;padding:30px 0 120px}.fatal{margin:20px 0;padding:16px;border:1px solid #8b4b32;border-radius:14px;background:#26160f}.modal{z-index:9999}.sheet{padding-bottom:80px}.statusline{font-size:12px;color:#9fb2c6;margin:8px 0}.good{color:#7dd3fc}.warn{color:#f6d46b}@media(max-width:900px){.cardgrid{grid-template-columns:1fr 1fr}.pick-row{grid-template-columns:1fr}}@media(max-width:650px){.cardgrid{grid-template-columns:1fr}.w{padding-bottom:180px!important}}</style></head><body><div class="w"><div class="top"><div><b>📡 Market Radar Daily · v0.2.4</b><div class="muted" id="reportClock">2026-08-19 · 최신 상태</div></div><a class="btn" href="../index.html">앱 홈</a></div><nav class="quicknav"><button class="pill" data-go="market">시장</button><button class="pill" data-go="themes">테마</button><button class="pill" data-go="action">행동</button><button class="pill" data-go="charts">그래프</button><button class="pill" data-go="picks">종목</button><button class="pill" data-go="mr-famous">대표주</button><button class="pill" data-go="mr-compounders">우상향</button><button class="pill" data-go="mr-universe">전체추적</button><button class="pill" data-go="expanded">숨은테마</button><button class="pill" data-go="etfs">ETF</button><button class="pill" data-go="allocation">비중</button><button class="pill" data-go="research">리서치</button><button class="pill" data-go="history">검증</button><button class="pill" data-go="macro">거시</button></nav><div id="loadState" class="statusline">대시보드 준비 중…</div><main id="app"><section class="hero" id="market"><div class="muted">안전 기본 화면 · 데이터 갱신 중</div><h1>🟠 고점권 조정·내부 로테이션</h1><div class="hero-action">공격 대기 + 선택적 분할매수</div><p>시장 전체는 대바닥보다 고점권 조정에 가깝다. 상대강도가 살아난 소프트웨어와 구조적 전력 수혜를 분할하고 현금을 남긴다.</p><div class="hero-final">🎯 소프트웨어·AI 전력은 분할, QQQ는 코어만, 반도체·광통신·3x는 바닥/추세 확인 후 확대</div><div class="scores"><div class="s">시장위험<b>63</b></div><div class="s">저점<b>26</b></div><div class="s">고점위험<b>66</b></div><div class="s">추세확인<b>54</b></div><div class="s">매수타이밍<b>55</b></div></div></section></main></div><div id="modal" class="modal"><div class="sheet"><div class="sheethead"><div><b id="modalTitle">상세</b><div class="muted" id="modalSub"></div></div><button class="close" id="modalClose">닫기 ✕</button></div><div id="modalBody"></div></div></div><script>(()=>{'use strict';const APP=document.getElementById('app'),STATE=document.getElementById('loadState'),CACHE='mr:last-good:v024',FOLD='mr:fold:v024:';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];const fmt=v=>v===undefined||v===null||v===''?'—':v;const bar=(v,c='#3b82f6')=>`<div class="track"><span style="width:${Math.max(0,Math.min(100,Number(v)||0))}%;background:${c}"></span></div>`;const color={software:'#2563eb',compute:'#7c3aed',network:'#ea580c',power:'#16a34a',defense:'#ca8a04',aggressive:'#dc2626',index:'#64748b',cash:'#94a3b8'};const FAMOUS=['MSFT','AAPL','NVDA','AMZN','GOOGL','META','TSLA','AMD','AVGO','PLTR','TSM','ANET','ORCL','COST'];const COMPOUND=['ANET','QQQ','MSFT','AVGO','COST','V','MA','SPGI','MCO','CTAS','PWR','ETN','WM','RSG','ORLY','AZO','VGT','XLK','SCHG'];const GROUPS=[['초대형 플랫폼',['MSFT','AAPL','NVDA','AMZN','GOOGL','META','TSLA']],['AI 반도체',['NVDA','AVGO','AMD','TSM','AMAT','LRCX','KLAC','MU']],['AI 소프트웨어',['MSFT','GOOGL','AMZN','ORCL','CRM','ADBE','PLTR']],['AI 전력·인프라',['CEG','VST','GEV','ETN','VRT','PWR','NVT','MOD','FIX']],['네트워크·광통신',['ANET','AVGO','MRVL','CRDO','COHR','LITE']],['사이버보안',['CRWD','PANW','FTNT','CIBR']]];const names={MSFT:'마이크로소프트',AAPL:'애플',NVDA:'엔비디아',AMZN:'아마존',GOOGL:'알파벳',META:'메타',TSLA:'테슬라',AMD:'AMD',AVGO:'브로드컴',PLTR:'팔란티어',TSM:'TSMC',ANET:'아리스타 네트웍스',ORCL:'오라클',COST:'코스트코',QQQ:'인베스코 QQQ'};function fold(id,title,body,open=false){return `<section class="sec fold-panel ${open?'':'is-folded'}" id="${id}"><div class="fold-head"><h2>${title}</h2><button class="fold-btn" type="button" data-fold="${id}">${open?'접기':'펼치기'}</button></div><div class="fold-body">${body}</div></section>`}function card(t,b=''){return `<article class="card"><b>${t}</b>${b}</article>`}function metric(k,v){return `<div class="s">${esc(k)}<b>${esc(fmt(v))}</b></div>`}function tickerName(t,d){return arr(d.top_picks).find(x=>x.ticker===t)?.name||d.details?.[t]?.name||names[t]||t}function chip(t,d){return `<button class="ticker-chip" type="button" data-ticker="${esc(t)}"><b>${esc(t)}</b><span>${esc(tickerName(t,d))}</span></button>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}function showModal(title,sub,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalSub').textContent=sub||'';document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.add('open')}function bind(d){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go)?.scrollIntoView({behavior:'smooth',block:'start'}));document.querySelectorAll('[data-fold]').forEach(b=>{const s=document.getElementById(b.dataset.fold);try{const v=localStorage.getItem(FOLD+b.dataset.fold);if(v==='1'){s.classList.add('is-folded');b.textContent='펼치기'}else if(v==='0'){s.classList.remove('is-folded');b.textContent='접기'}}catch{}b.onclick=()=>{const f=s.classList.toggle('is-folded');b.textContent=f?'펼치기':'접기';try{localStorage.setItem(FOLD+b.dataset.fold,f?'1':'0')}catch{}}});document.querySelectorAll('[data-ticker]').forEach(el=>el.onclick=()=>{const t=el.dataset.ticker,p=arr(d.top_picks).find(x=>x.ticker===t)||{},x=d.details?.[t]||{};const blocks=[['한줄 평가',x.summary||p.note],['최근 실적',x.earnings],['가이던스·전망',x.outlook||x.guidance],['밸류',x.valuation],['재무상태',x.balance],['현금흐름',x.cashflow],['Bull',x.bull],['Bear',x.bear]].filter(z=>z[1]).map(z=>`<div class="detailblock"><h4>${esc(z[0])}</h4><div>${esc(z[1])}</div></div>`).join('');showModal(`${t} — ${tickerName(t,d)}`,`${p.phase||'추적'} · ${p.action||'관찰'}`,`<div class="metrics"><div class="metric">종합<b>${esc(fmt(p.score))}</b></div><div class="metric">매수<b>${esc(fmt(p.timing))}</b></div><div class="metric">부의성장<b>${esc(fmt(p.wealth))}</b></div></div>${blocks||'<div class="detailblock">현재 추적 유니버스에 포함된 종목입니다.</div>'}`)});document.querySelectorAll('[data-theme]').forEach(el=>el.onclick=()=>{const t=arr(d.themes).find(x=>x.key===el.dataset.theme);if(!t)return;showModal(`${t.emoji||''} ${t.name}`,t.phase||'',`<div class="metrics"><div class="metric">점수<b>${esc(fmt(t.score))}</b></div><div class="metric">매수<b>${esc(fmt(t.timing))}</b></div><div class="metric">과열<b>${esc(fmt(t.overheat))}</b></div><div class="metric">상승여력<b>${esc(fmt(t.upside))}</b></div></div><div class="detailblock"><h4>현재 평가</h4><div>${esc(t.action||'')}</div></div>`)});document.getElementById('modalClose').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')}}function render(d){const m=d.market||{},themes=arr(d.themes).slice().sort((a,b)=>(b.score||0)-(a.score||0)),picks=arr(d.top_picks).slice().sort((a,b)=>(b.score||0)-(a.score||0)),expanded=arr(d.expanded_themes).slice().sort((a,b)=>(a.rank||99)-(b.rank||99)),research=arr(d.research),us=arr(d.etf_lists?.us_listed).length?arr(d.etf_lists.us_listed):arr(d.etf_lists?.us),kr=arr(d.etf_lists?.kr_listed).length?arr(d.etf_lists.kr_listed):arr(d.etf_lists?.kr),alloc=arr(d.model_allocation),history=arr(d.strategy_validation?.scores),macroRaw=d.macro,macro=Array.isArray(macroRaw)?macroRaw:(macroRaw&&typeof macroRaw==='object'?Object.entries(macroRaw).map(([title,value])=>({title,value:typeof value==='object'?JSON.stringify(value):value})):[]);const hero=`<section class="hero" id="market"><div class="muted">최신 FULL 데이터 · ${esc(d.updated_at||d.date||'2026-08-19')}</div><h1>${esc(m.phase||'시장 상태')}</h1><div class="hero-action">${esc(m.action||'')}</div><p>${esc(m.summary||'')}</p><div class="hero-final">🎯 ${esc(m.final_action||m.action||'')}</div><div class="scores">${metric('시장위험',m.risk)}${metric('저점',m.bottom_score)}${metric('고점위험',m.top_risk)}${metric('추세확인',m.trend_confirmation)}${metric('매수타이밍',m.buy_timing)}</div></section>`;const themeBody=themes.map(t=>`<button class="card theme-card" type="button" data-theme="${esc(t.key)}"><b>${esc(t.emoji||'')} ${esc(t.name)} · ${esc(fmt(t.score))}</b><small>${esc(t.phase||'')}</small>${bar(t.timing,color[t.key]||'#3b82f6')}<em>${esc(t.action||'')}</em></button>`).join('');const actionBody=`<div class="cardgrid">${card('✅ 지금 한다',`<p>${esc(m.action||'선택적 분할매수 + 현금 유지')}</p>`)}${card('⏳ 기다린다',`<p>${esc(m.wait_action||'급락 테마는 바닥·추세 확인')}</p>`)}${card('🚀 확대 조건',`<p>${esc(m.next_trigger||'higher-low·20/50DMA·breadth·금리 안정')}</p>`)}</div>`;const chartBody=`<div class="cardgrid">${['QQQ','SMH','SOXX','SOXL','NVDA','AMD','ANET','META'].map(t=>card(t,'<div class="muted">실제 가격 차트는 종목 상세/외부 차트에서 확인</div>')).join('')}</div>`;const pickBody=picks.map(p=>`<div class="pick-row" data-ticker="${esc(p.ticker)}"><div><b>${esc(p.ticker)} — ${esc(p.name||tickerName(p.ticker,d))}</b><small>${esc(p.phase||'')} · ${esc(p.action||'')}</small></div><div>${bar(p.timing,color[p.theme]||'#3b82f6')}</div><b>${esc(fmt(p.score))}</b></div>`).join('');const famousBody=`<div class="chips">${FAMOUS.map(t=>chip(t,d)).join('')}</div>`;const compoundBody=`<div class="chips">${COMPOUND.map(t=>chip(t,d)).join('')}</div>`;const universeBody=`<div class="cardgrid">${GROUPS.map(([g,ts])=>card(esc(g),`<div class="chips">${ts.map(t=>chip(t,d)).join('')}</div>`)).join('')}</div>`;const expandedBody=`<div class="cardgrid">${expanded.map(x=>card(`#${esc(fmt(x.rank))} ${esc(x.name)}`,`<p>${esc(x.thesis||x.role||'')}</p><small>${esc(x.risk||'')}</small><div class="chips">${arr(x.tickers).map(t=>chip(t,d)).join('')}</div>`)).join('')}</div>`;const etfRows=list=>list.map(x=>`<tr><td><b>${esc(x.ticker||x.code||'')}</b></td><td>${esc(x.name||'')}</td><td>${esc(x.theme||'')}</td><td>${esc(fmt(x.score))}</td><td>${esc(x.action||'')}</td></tr>`).join('');const etfBody=`<h3>미국 ETF</h3>${table(['티커','이름','테마','점수','행동'],etfRows(us))}<h3>국내 ETF</h3>${table(['코드','이름','테마','점수','행동'],etfRows(kr))}`;const allocBody=alloc.length?alloc.map(x=>`<div class="pick-row"><div><b>${esc(x.name||x.asset||x.ticker||'자산')}</b><small>${esc(x.reason||x.note||'')}</small></div><div>${bar(x.weight||x.pct||x.percent,'#60a5fa')}</div><b>${esc(fmt(x.weight||x.pct||x.percent))}%</b></div>`).join(''):'<div class="muted">모델 비중 데이터가 없습니다.</div>';const researchBody=`<div class="cardgrid">${research.map(r=>card(esc(r.org||r.source||'리서치'),`<p>${esc(r.take||r.summary||'')}</p><small>${esc(r.action||r.conflict||'')}</small>`)).join('')}</div>`;const histBody=history.length?history.map(x=>`<div class="pick-row"><div><b>${esc(x.date||x.label||'검증')}</b><small>${esc(x.note||'')}</small></div><div>${bar(x.score||x.value,'#22c55e')}</div><b>${esc(fmt(x.score||x.value))}</b></div>`).join(''):'<div class="muted">검증 기록 없음</div>';const macroBody=`<div class="cardgrid">${macro.map(x=>card(esc(x.title||x.name||'거시'),`<p>${esc(x.value||x.summary||x.note||'')}</p>`)).join('')}</div>`;APP.innerHTML=hero+fold('themes','🎨 테마',`<div class="cardgrid">${themeBody}</div>`,true)+fold('action','🧭 행동',actionBody,false)+fold('charts','📈 그래프',chartBody,false)+fold('picks','🏆 종목',pickBody,true)+fold('mr-famous','🌟 대표주',famousBody,false)+fold('mr-compounders','📈 우상향 품질주',compoundBody,false)+fold('mr-universe','🧩 전체추적',universeBody,false)+fold('expanded','🕵 숨은 테마',expandedBody,false)+fold('etfs','🧺 ETF',etfBody,false)+fold('allocation','⚖️ 비중',allocBody,false)+fold('research','🧠 리서치',researchBody,false)+fold('history','🧪 검증',histBody,false)+fold('macro','🌐 거시',macroBody,false)+'<div class="endmark">✓ 전체 대시보드 렌더링 완료 · v0.2.4</div>';bind(d);try{localStorage.setItem(CACHE,JSON.stringify({html:APP.innerHTML,data:d,at:Date.now()}))}catch{}STATE.innerHTML='<span class="good">정상 · 전체 대시보드 고정 완료</span>'}function restore(){try{const c=JSON.parse(localStorage.getItem(CACHE)||'null');if(c?.html&&c?.data){APP.innerHTML=c.html;bind(c.data);STATE.innerHTML='<span class="good">저장된 정상 화면 즉시 복원</span>';return true}}catch{}return false}async function fetchJson(url,tries=2){let last;for(let i=0;i<tries;i++){try{const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json();last='HTTP '+r.status}catch(e){last=e}await new Promise(r=>setTimeout(r,350*(i+1)))}throw last||new Error('fetch failed')}async function load(){const had=restore();const urls=['../data/latest.json','https://raw.githubusercontent.com/kimjae134679/stock/main/public/data/latest.json'];for(const u of urls){try{const d=await fetchJson(u,3);render(d);return}catch(e){}}if(had){STATE.innerHTML='<span class="warn">실시간 갱신 실패 · 마지막 정상 화면 유지</span>';return}STATE.innerHTML='<span class="warn">데이터 연결 실패 · 기본 안전 화면 유지</span>'}function clock(){const el=document.getElementById('reportClock');try{el.textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())+' KST · 최신 상태'}catch{}}clock();setInterval(clock,30000);load()})();</script></body></html>
