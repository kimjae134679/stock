(()=>{
'use strict';
const $=s=>document.querySelector(s), panel=$('#loadPanel'), pct=$('#loadPct'), bar=$('#loadBar'), msg=$('#loadMsg'), detail=$('#loadDetail'), state=$('#loadState');let current=.001,failed=false;
const fmt=n=>{const s=Number(n).toFixed(3);return Number(n)<10?'0'+s:s};
window.__MR_PROGRESS__=(n,m,d)=>{if(failed)return;current=Math.max(current,Math.min(100,Number(n)||0));if(pct)pct.textContent=fmt(current)+'%';if(bar)bar.style.width=current+'%';if(m&&msg)msg.textContent=m;if(d&&detail)detail.textContent=d};
window.__MR_LOAD_DONE__=()=>{failed=false;window.__MR_PROGRESS__(100,'전체 대시보드 로드 완료','데이터·핵심 렌더·부가 기능·최종 DOM 검증 완료');panel?.classList.add('done');if(state){state.textContent='정상 · v0.3.5 전체 대시보드 로드 완료';state.className='statusline good'}};
window.__MR_LOAD_FAIL__=e=>{failed=true;panel?.classList.add('fail');if(msg)msg.textContent='로드 중단';if(detail)detail.textContent=String(e||'원인 미확인');if(state){state.textContent='오류 · '+String(e||'로드 실패');state.className='statusline warn'}};
window.__MR_PROGRESS__(1.001,'페이지 셸 준비 완료','캐시·기존 Service Worker 정리 시작');
async function purge(){try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}}catch(_){ }try{if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}}catch(_){ }try{Object.keys(localStorage).filter(k=>k==='mr:last-good'||k.startsWith('mr:last-good:')).forEach(k=>localStorage.removeItem(k))}catch(_){}}
async function probe(url,critical,label,progress){try{const r=await fetch(url+(url.includes('?')?'&':'?')+'preflight='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);await r.clone().json();window.__MR_PROGRESS__(progress,label+' 확인 완료',url);return true}catch(e){if(critical)throw new Error(label+' 실패 · '+e.message);window.__MR_PROGRESS__(progress,label+' 없음/건너뜀',url+' · '+e.message);return false}}
function loadScript(file,progress){return new Promise((ok,fail)=>{const s=document.createElement('script');s.src='../assets/'+file+'?v35='+Date.now();s.async=false;s.onload=()=>{window.__MR_PROGRESS__(progress,file+' 로드 완료','실제 script load 이벤트 수신');ok()};s.onerror=()=>fail(new Error(file+' 로드 실패'));document.body.appendChild(s)})}
function sectionCount(){return document.querySelectorAll('#app .sec,#app .fold-panel').length}
async function waitBase(){const start=Date.now();while(Date.now()-start<10000){const n=sectionCount();window.__MR_PROGRESS__(Math.min(60,43+n*2.1),'핵심 대시보드 렌더 중 · '+n+'개 섹션','full-recovery 렌더 결과를 실제 DOM에서 확인 중');if(n>=8&&window.__MR_D)return true;await new Promise(r=>setTimeout(r,180))}throw new Error('핵심 렌더러가 10초 안에 전체 섹션을 만들지 못함 · 현재 '+sectionCount()+'개')}
async function clock(){const el=$('#reportClock');if(!el)return;for(const u of ['../data/live/phase-status.json','../data/latest.json']){try{const r=await fetch(u+'?clock='+Date.now(),{cache:'no-store'});if(!r.ok)continue;const x=await r.json(),d=new Date(x.updated_at);if(Number.isNaN(d.getTime()))continue;const p=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',hour12:false}).formatToParts(d),g=t=>p.find(y=>y.type===t)?.value||'';el.textContent=`${g('year')}.${g('month')}.${g('day')} ${Number(g('hour'))}시 업데이트`;return}catch(_){}}el.textContent='업데이트 시간 미확인'}
(async()=>{try{await purge();window.__MR_PROGRESS__(5.000,'캐시 정리 완료','기존 Service Worker·CacheStorage·last-good 캐시 제거 완료');await probe('../data/latest.json',true,'핵심 시장 데이터',10);await probe('../data/live/intraday.json',true,'시간별 데이터',15);await probe('../data/live/phase-status.json',false,'독립 Phase 데이터',20);await probe('../data/cycle-history.json',false,'역사 주기 데이터',25);clock();await loadScript('full-recovery-v22.js',35);await waitBase();await loadScript('evaluation-v26.js',65);await loadScript('layout-v28.js',71);await loadScript('returns-v29.js',77);await loadScript('phase-status-v29.js',83);await loadScript('ui-v30.js',88);await loadScript('cycle-history-v34.js',93);await loadScript('app-runtime-v35.js',97);window.__MR_PROGRESS__(98.500,'최종 화면 검증 대기','app-runtime-v35가 실제 섹션 수와 페이지 높이를 확인 중')}catch(e){window.__MR_LOAD_FAIL__(e.message||e)}})();
})();
</script></body></html>
