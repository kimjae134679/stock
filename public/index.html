<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#08111d" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Market Radar</title>
<style>
:root{--bg:#071018;--panel:#0d1722;--panel2:#111e2b;--line:#263548;--text:#eaf2fb;--muted:#93a4b7;--good:#4ade80;--bad:#fb7185;--warn:#fde047;--orange:#fb923c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101a,#08131e 35%,#071018);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:1400px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h1{margin:0;font-size:26px}.muted{color:var(--muted)}.pill{border:1px solid var(--line);background:#101c29;border-radius:999px;padding:7px 10px;font-size:12px}.hero{margin:16px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,#122235,#101821 60%,#2a1d0b);border:1px solid #4d5f75}.hero .phase{font-size:29px;font-weight:950;line-height:1.2}.hero .action{font-size:17px;color:#fde68a;font-weight:850;margin-top:5px}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:13px}.score{background:#0a1521;border-radius:10px;padding:9px;text-align:center}.score b{display:block;font-size:21px}.section{margin-top:24px}.section h2{font-size:20px;margin:0 0 9px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.theme{position:relative;overflow:hidden}.theme:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}.theme .name{font-size:16px;font-weight:900}.theme .phase{font-size:18px;font-weight:900;margin:6px 0}.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px}.kv span{color:var(--muted)}.pick{display:grid;grid-template-columns:6px 1fr 48px;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.pick .line{border-radius:99px}.pick b{display:block}.pick small{color:var(--muted)}.pick .s{text-align:right;font-size:20px;font-weight:900}.alloc{display:grid;grid-template-columns:1fr 60px 78px 65px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #223247}.alloc input{width:100%;background:#111e2b;color:#fff;border:1px solid #33465d;border-radius:7px;padding:6px}.delta.pos{color:var(--good)}.delta.neg{color:var(--bad)}.toolbar{display:flex;gap:7px;overflow:auto;margin:8px 0 12px}.toolbar button{border:1px solid var(--line);background:#111e2b;color:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}.toolbar button.active{outline:2px solid #94a3b8}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.notice{margin:12px 0;padding:10px 12px;border:1px solid #665b20;background:#211d0d;color:#fde68a;border-radius:11px}.hidden{display:none!important}.loading{padding:30px;text-align:center;color:#93a4b7}
@media(max-width:800px){.wrap{padding:12px}.grid,.macro{grid-template-columns:1fr}.scores{grid-template-columns:1fr 1fr}.score:last-child{grid-column:1/-1}.hero .phase{font-size:24px}.top h1{font-size:22px}.alloc{grid-template-columns:1fr 46px 65px 58px;font-size:12px}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><h1>Market Radar</h1><div class="muted" id="updated">불러오는 중…</div></div><div class="pill" id="status">SYNC</div></div>
<div id="app" class="loading">시장 데이터를 불러오는 중…</div>
</div>
<script>
const REMOTE='https://kimjae134679.github.io/stock/data/latest.json';
const LOCAL='data/latest.json';
const colors={software:'#2563eb',compute:'#7c3aed',network:'#ea580c',power:'#16a34a',defense:'#ca8a04',aggressive:'#dc2626',index:'#64748b'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getData(){for(const u of [REMOTE+'?t='+Date.now(),LOCAL]){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw new Error('데이터를 불러오지 못했습니다')}
function themeCard(t){return `<div class="card theme" data-theme="${t.key}" style="--c:${colors[t.key]||'#64748b'}"><div class="name">${esc(t.emoji)} ${esc(t.name)}</div><div class="phase">${esc(t.phase)}</div><div class="kv"><span>점수</span><b>${t.score}</b><span>관심</span><b>${esc(t.popularity)}</b><span>과열위험</span><b>${t.overheat}</b><span>상승여력</span><b>${t.upside}</b></div><div style="margin-top:7px;color:#fde68a;font-weight:800">${esc(t.action)}</div></div>`}
function pickCard(p){return `<div class="pick pickrow" data-theme="${p.theme}"><div class="line" style="background:${colors[p.theme]||'#64748b'}"></div><div><b>${esc(p.ticker)} — ${esc(p.name)}</b><small>${esc(p.phase)} · ${esc(p.action)}<br>${esc(p.note)}</small></div><div class="s">${p.score}</div></div>`}
function render(d){document.getElementById('updated').textContent='업데이트 '+new Date(d.updated_at).toLocaleString();document.getElementById('status').textContent='LIVE';
let html=`<section class="hero"><div class="muted">현재 시장 Phase</div><div class="phase">${esc(d.market.phase)}</div><div class="action">${esc(d.market.action)}</div><div class="muted" style="margin-top:6px">${esc(d.market.summary)}</div><div class="scores"><div class="score">시장위험<b>${d.market.risk}</b></div><div class="score">저점<b>${d.market.bottom_score}</b></div><div class="score">고점위험<b>${d.market.top_risk}</b></div><div class="score">추세확인<b>${d.market.trend_confirmation}</b></div><div class="score">매수타이밍<b>${d.market.buy_timing}</b></div></div></section>`;
html+=`<section class="section"><h2>🎨 테마 순위</h2><div class="grid">${d.themes.sort((a,b)=>b.score-a.score).map(themeCard).join('')}</div></section>`;
html+=`<section class="section"><h2>🏆 종목·ETF 우선순위</h2><div class="toolbar" id="filters"><button class="active" data-f="all">전체</button>${d.themes.map(t=>`<button data-f="${t.key}">${esc(t.emoji)} ${esc(t.name)}</button>`).join('')}</div><div id="picks">${d.top_picks.sort((a,b)=>b.score-a.score).map(pickCard).join('')}</div></section>`;
html+=`<section class="section"><h2>🍯 숨은 수혜 테마</h2><div class="grid">${d.hidden_themes.sort((a,b)=>a.rank-b.rank).map(x=>`<div class="card"><b>#${x.rank} ${esc(x.name)}</b><div style="font-size:23px;font-weight:900;color:#4ade80">${x.score}</div><div class="muted">${x.tickers.join(' · ')}</div></div>`).join('')}</div></section>`;
html+=`<section class="section"><h2>🎯 모델 리밸런싱</h2><div class="notice">실제 보유비중은 이 기기에만 저장되고 GitHub로 전송되지 않음.</div><div class="card"><div class="alloc" style="font-weight:800"><div>자산</div><div>목표</div><div>내 현재%</div><div>증감</div></div>${d.model_allocation.map((a,i)=>`<div class="alloc"><div>${esc(a.asset)}</div><div>${a.weight}%</div><input type="number" min="0" max="100" step="0.5" value="${localStorage.getItem('w:'+a.asset)||0}" data-target="${a.weight}" data-key="${esc(a.asset)}"><div class="delta"></div></div>`).join('')}<div style="margin-top:9px">현재 입력합계 <b id="total">0%</b></div></div></section>`;
html+=`<section class="section"><h2>🕰️ 역사적 유사구간</h2><div class="grid">${d.analogs.sort((a,b)=>b.similarity-a.similarity).map((x,i)=>`<div class="card"><b>#${i+1} ${esc(x.date)}</b><div style="font-size:27px;font-weight:950">${x.similarity}</div><div class="muted">${esc(x.reason)}</div></div>`).join('')}</div></section>`;
html+=`<section class="section"><h2>🌍 거시·국제경제</h2><div class="macro">${d.macro.map(m=>`<div class="card"><b>${esc(m.title)}</b><div style="font-size:17px;font-weight:900">${esc(m.value)}</div><div class="muted">${esc(m.meaning)}</div></div>`).join('')}</div></section>`;
document.getElementById('app').className='';document.getElementById('app').innerHTML=html;bind();}
function bind(){document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.f;document.querySelectorAll('.pickrow').forEach(r=>r.classList.toggle('hidden',f!=='all'&&r.dataset.theme!==f))});const inputs=[...document.querySelectorAll('.alloc input')];const recalc=()=>{let total=0;inputs.forEach(inp=>{const v=+inp.value||0,totalTarget=+inp.dataset.target||0;total+=v;localStorage.setItem('w:'+inp.dataset.key,v);const d=totalTarget-v,el=inp.parentElement.querySelector('.delta');el.textContent=(d>=0?'+':'')+d.toFixed(1)+'%p';el.className='delta '+(d>=0?'pos':'neg')});document.getElementById('total').textContent=total.toFixed(1)+'%'};inputs.forEach(i=>i.oninput=recalc);recalc();}
getData().then(render).catch(e=>{document.getElementById('status').textContent='OFFLINE';document.getElementById('app').innerHTML='<div class="notice">'+esc(e.message)+'</div>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
