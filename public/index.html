<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><link rel="manifest" href="manifest.webmanifest"><title>Market Radar</title><style>html,body{margin:0;width:100%;height:100%;background:#071018;color:#eaf2fb;font-family:system-ui}#f{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071018}#status{position:fixed;right:8px;top:max(8px,env(safe-area-inset-top));z-index:99;background:#0d1722cc;border:1px solid #263548;border-radius:999px;padding:5px 8px;font-size:11px;pointer-events:none}</style></head><body><div id="status">SYNC</div><iframe id="f" title="Market Radar"></iframe><script>const REMOTE='https://kimjae134679.github.io/stock/reports/latest.html';const LOCAL='reports/latest.html';const f=document.getElementById('f'),s=document.getElementById('status');function load(){if(navigator.onLine){f.src=REMOTE+'?t='+Date.now();s.textContent='LIVE'}else{f.src=LOCAL;s.textContent='OFFLINE'}}window.addEventListener('online',load);window.addEventListener('offline',load);f.addEventListener('error',()=>{f.src=LOCAL;s.textContent='CACHE'});load();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
