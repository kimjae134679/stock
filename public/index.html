<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071018">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<title>Market Radar</title>
<style>
:root{--bg:#071018;--panel:#0d1722;--panel2:#111e2b;--line:#263548;--text:#eaf2fb;--muted:#93a4b7;--good:#4ade80;--bad:#fb7185;--warn:#fde047;--orange:#fb923c}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#06101a,#08131e 35%,#071018);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif}.wrap{max-width:1450px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:50;background:rgba(7,16,24,.88);backdrop-filter:blur(12px);padding:8px 0}.brand h1{margin:0;font-size:24px}.muted{color:var(--muted)}.status{border:1px solid var(--line);background:#101c29;border-radius:999px;padding:7px 10px;font-size:12px}.hero{margin:10px 0 14px;padding:18px;border-radius:18px;background:radial-gradient(circle at 95% 0,rgba(249,115,22,.22),transparent 34%),linear-gradient(135deg,#122235,#101821 60%,#2a1d0b);border:1px solid #4d5f75}.hero .kicker{font-size:11px;color:#fbbf24;font-weight:900;letter-spacing:.06em}.hero .phase{font-size:29px;font-weight:950;line-height:1.2;margin:4px 0}.hero .action{font-size:17px;color:#fde68a;font-weight:850}.hero .summary{margin-top:5px;color:#c4d1df}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}.score{background:#0a1521;border-radius:10px;padding:9px;text-align:center}.score b{display:block;font-size:21px}.analogrow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.analog{background:#0b1723;border:1px solid #2b4057;border-radius:10px;padding:9px}.analog strong{font-size:17px}.analog span{float:right;font-size:20px;font-weight:950;color:#facc15}.section{margin-top:22px}.section h2{font-size:20px;margin:0 0 8px}.sub{font-size:12px;color:var(--muted);margin-top:-4px;margin-bottom:8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.theme{position:relative;overflow:hidden}.theme:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}.theme .name{font-size:15px;font-weight:900}.theme .phase{font-size:18px;font-weight:900;margin:5px 0}.kv{display:grid;grid-template-columns:1fr auto;gap:3px 8px}.kv span{color:var(--muted)}.actionbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px}.act b{display:block;font-size:15px;margin-bottom:3px}.act span{color:#a9b8c8;font-size:12px}.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.chart h3{margin:0 0 2px;font-size:16px}.barrow{display:grid;grid-template-columns:150px 1fr 34px;gap:7px;align-items:center;margin:7px 0}.barname{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:9px;background:#172638;border-radius:999px;overflow:hidden;margin:2px 0}.track span{display:block;height:100%;border-radius:999px}.wealth span{background:#f59e0b!important}.barnum{text-align:right;font-size:11px;font-weight:800}.pick{display:grid;grid-template-columns:6px minmax(0,1fr) 48px;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0}.pick .line{border-radius:99px}.pick b{display:block}.pick small{color:var(--muted)}.pick .s{text-align:right;font-size:20px;font-weight:900}.toolbar{display:flex;gap:7px;overflow:auto;margin:8px 0 11px;padding-bottom:2px}.toolbar button,.btn{border:1px solid var(--line);background:#111e2b;color:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;text-decoration:none;display:inline-block}.toolbar button.active{outline:2px solid #94a3b8}.hidden{display:none!important}.allocwrap{display:grid;grid-template-columns:320px 1fr;gap:10px}.donutCard,.allocCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.donut{width:210px;height:210px;border-radius:50%;margin:8px auto;background:conic-gradient(#94a3b8 0 20%,#64748b 20% 30%,#dc2626 30% 35%,#2563eb 35% 55%,#7c3aed 55% 72%,#ea580c 72% 75%,#16a34a 75% 92%,#ca8a04 92% 96%,#22c55e 96% 100%);position:relative}.donut:after{content:"모델 100%";position:absolute;inset:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#0d1722;font-weight:900}.alloc{display:grid;grid-template-columns:minmax(0,1fr) 50px 74px 60px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #223247}.alloc input{width:100%;min-width:0;background:#111e2b;color:#fff;border:1px solid #33465d;border-radius:7px;padding:6px}.delta.pos{color:var(--good)}.delta.neg{color:var(--bad)}.notice{margin:10px 0;padding:10px 12px;border:1px solid #665b20;background:#211d0d;color:#fde68a;border-radius:11px}.research{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.research .rscore{font-size:20px;font-weight:950;color:#60a5fa}.research .org{font-weight:900}.research .take{font-size:12px;color:#b9c8d8;margin-top:3px}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.macro .value{font-size:16px;font-weight:900}.reportcta{display:flex;gap:8px;flex-wrap:wrap;background:linear-gradient(135deg,#10243a,#0d1722);border:1px solid #36516e;border-radius:14px;padding:13px;align-items:center;justify-content:space-between}.reportcta strong{font-size:17px}.loading{padding:40px;text-align:center;color:#93a4b7}
@media(max-width:900px){.grid,.research,.macro{grid-template-columns:1fr 1fr}.bars,.allocwrap{grid-template-columns:1fr}.actionbox{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.wrap{padding:10px}.brand h1{font-size:20px}.hero{padding:14px}.hero .phase{font-size:24px}.scores{grid-template-columns:1fr 1fr}.score:last-child{grid-column:1/-1}.analogrow,.grid,.research,.macro,.actionbox{grid-template-columns:1fr}.barrow{grid-template-columns:120px 1fr 30px}.alloc{grid-template-columns:minmax(0,1fr) 42px 62px 54px;font-size:11px}.donut{width:190px;height:190px}.donut:after{inset:44px}.top{padding-top:max(6px,env(safe-area-inset-top))}}
</style>
</head>
<body><div class="wrap"><div class="top"><div class="brand"><h1>📡 Market Radar</h1><div class="muted" id="updated">동기화 중…</div></div><div class="status" id="status">SYNC</div></div><div id="app" class="loading">최신 시장 분석을 불러오는 중…</div></div>
<script>
const REMOTE='https://kimjae134679.github.io/stock/data/latest.json';const LOCAL='data/latest.json';const BASE='https://kimjae134679.github.io/stock/';const colors={software:'#2563eb',compute:'#7c3aed',network:'#ea580c',power:'#16a34a',defense:'#ca8a04',aggressive:'#dc2626',index:'#64748b',cash:'#94a3b8'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function getData(){for(const u of [REMOTE+'?t='+Date.now(),LOCAL]){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}}throw new Error('시장 데이터를 불러오지 못했습니다')}function analogs(d){return(d.analogs||[]).sort((a,b)=>b.similarity-a.similarity).slice(0,3).map((x,i)=>`<div class="analog"><span>${x.similarity}</span><b>#${i+1} ${esc(x.date)}</b><div class="muted">${esc(x.reason)}</div></div>`).join('')}function themeCard(t){return`<div class="card theme" data-theme="${t.key}" style="--c:${colors[t.key]||'#64748b'}"><div class="name">${esc(t.emoji)} ${esc(t.name)} · ${t.score}</div><div class="phase">${esc(t.phase)}</div><div class="kv"><span>매수타이밍</span><b>${t.timing??'-'}</b><span>관심</span><b>${esc(t.popularity)}</b><span>과열위험</span><b>${t.overheat}</b><span>상승여력</span><b>${t.upside}</b></div><div style="margin-top:7px;color:#fde68a;font-weight:800">${esc(t.action)}</div></div>`}function pickCard(p){return`<div class="pick pickrow" data-theme="${p.theme}"><div class="line" style="background:${colors[p.theme]||'#64748b'}"></div><div><b>${esc(p.ticker)} — ${esc(p.name)}</b><small>${esc(p.phase)} · ${esc(p.action)}<br>${esc(p.note)}</small></div><div class="s">${p.score}</div></div>`}function assetBars(d){return(d.top_picks||[]).sort((a,b)=>b.score-a.score).slice(0,11).map(p=>`<div class="barrow"><div class="barname">${esc(p.ticker)} — ${esc(p.name)}</div><div><div class="track"><span style="width:${p.timing}%;background:${colors[p.theme]||'#64748b'}"></span></div><div class="track wealth"><span style="width:${p.wealth}%"></span></div></div><div class="barnum">${p.timing}</div></div>`).join('')}function themeBars(d){return(d.themes||[]).sort((a,b)=>b.score-a.score).map(t=>`<div class="barrow"><div class="barname">${esc(t.emoji)} ${esc(t.name)}</div><div><div class="track"><span style="width:${t.timing??0}%;background:${colors[t.key]||'#64748b'}"></span></div><div class="track"><span style="width:${t.overheat}%;background:#ef4444"></span></div><div class="track"><span style="width:${t.upside}%;background:#22c55e"></span></div></div><div class="barnum">${t.timing??'-'}</div></div>`).join('')}function phaseActions(d){return`<div class="actionbox"><div class="act"><b>✅ 지금 한다</b><span>상대강도가 살아난 소프트웨어·전력 수혜를 분할. QQQ는 코어만.</span></div><div class="act"><b>⏳ 기다린다</b><span>반도체·광통신은 higher-low와 20DMA 회복 확인.</span></div><div class="act"><b>🚀 공격 전환</b><span>${esc(d.market.next_trigger||'추세 확인 후 공격성 확대')}</span></div></div>`}function reportUrl(d){const p=d.report_path||d.report_latest_path||'reports/latest.html';return p.startsWith('http')?p:BASE+p}function render(d){document.getElementById('updated').textContent='업데이트 '+new Date(d.updated_at).toLocaleString('ko-KR');document.getElementById('status').textContent='LIVE';let h=`<section class="hero"><div class="kicker">HISTORICAL MARKET POSITION · 현재 가장 먼저 볼 것</div><div class="phase">${esc(d.market.phase)}</div><div class="action">${esc(d.market.action)}</div><div class="summary">${esc(d.market.summary)}</div><div class="scores"><div class="score">시장위험<b>${d.market.risk}</b></div><div class="score">저점<b>${d.market.bottom_score}</b></div><div class="score">고점위험<b>${d.market.top_risk}</b></div><div class="score">추세확인<b>${d.market.trend_confirmation}</b></div><div class="score">매수타이밍<b>${d.market.buy_timing}</b></div></div><div class="analogrow">${analogs(d)}</div></section>`;h+=`<section class="reportcta"><div><strong>📄 오늘 전체 HTML 보고서</strong><div class="muted">그래프·리서치·역사검증·거시까지 전체판</div></div><a class="btn" href="${reportUrl(d)}" target="_self">전체 보고서 열기</a></section>`;h+=`<section class="section"><h2>🎨 현재 테마 흐름</h2><div class="sub">점수 높은 순</div><div class="grid">${(d.themes||[]).sort((a,b)=>b.score-a.score).map(themeCard).join('')}</div></section>`;h+=`<section class="section"><h2>🧭 현재 행동</h2>${phaseActions(d)}<div class="notice"><b>현재 피할 것:</b> ${esc(d.market.avoid||'급락 자산 추격')}</div></section>`;h+=`<section class="section"><h2>📊 비교 그래프</h2><div class="bars"><div class="chart"><h3>매수타이밍 vs 부의성장</h3><div class="sub">위 막대=현재 타이밍 · 아래 주황=장기 부의성장 잠재력</div>${assetBars(d)}</div><div class="chart"><h3>테마: 타이밍 / 과열 / 상승여력</h3><div class="sub">각 행 위부터 타이밍·빨강 과열·초록 상승여력</div>${themeBars(d)}</div></div></section>`;h+=`<section class="section"><h2>🏆 종목·ETF 우선순위</h2><div class="toolbar" id="filters"><button class="active" data-f="all">전체</button>${(d.themes||[]).map(t=>`<button data-f="${t.key}">${esc(t.emoji)} ${esc(t.name)}</button>`).join('')}</div><div id="picks">${(d.top_picks||[]).sort((a,b)=>b.score-a.score).map(pickCard).join('')}</div></section>`;h+=`<section class="section"><h2>🍯 숨은 수혜 테마</h2><div class="grid">${(d.hidden_themes||[]).sort((a,b)=>a.rank-b.rank).map(x=>`<div class="card"><b>#${x.rank} ${esc(x.name)}</b><div style="font-size:23px;font-weight:950;color:#4ade80">${x.score}</div><div>${esc(x.state||'')}</div><div class="muted">${(x.tickers||[]).join(' · ')}</div></div>`).join('')}</div></section>`;h+=`<section class="section"><h2>🎯 추천비율 & 내 보유 리밸런싱</h2><div class="notice"><b>신규자금 100 기준 모델.</b> 내 현재 비중은 이 기기에만 저장되고 GitHub로 전송되지 않는다.</div><div class="allocwrap"><div class="donutCard"><div class="donut"></div><div class="muted">현재는 대바닥이 아니라 현금·대기자금을 남기고 선택적 분할. 추세 확인 때 공격슬롯 확대.</div></div><div class="allocCard"><div class="alloc" style="font-weight:850"><div>자산</div><div>목표</div><div>내 현재%</div><div>증감</div></div>${(d.model_allocation||[]).map(a=>`<div class="alloc"><div>${esc(a.asset)}</div><div>${a.weight}%</div><input type="number" min="0" max="100" step="0.5" value="${localStorage.getItem('w:'+a.asset)||0}" data-target="${a.weight}" data-key="${esc(a.asset)}"><div class="delta"></div></div>`).join('')}<div style="margin-top:9px">현재 입력합계 <b id="total">0%</b></div></div></div></section>`;h+=`<section class="section"><h2>🏦 리서치 컨센서스</h2><div class="research">${(d.research||[]).sort((a,b)=>(b.score||0)-(a.score||0)).map(r=>`<div class="card"><div class="org">${esc(r.org)}</div><div class="rscore">${r.score??'—'}</div><div class="take">${esc(r.take)}</div></div>`).join('')}</div></section>`;h+=`<section class="section"><h2>🧪 과거 전략검증</h2><div class="card"><b>${esc(d.strategy_validation?.summary||'')}</b><div class="sub">정식 전수 백테스트가 아니라 지정 변곡점 event-study</div>${(d.strategy_validation?.scores||[]).sort((a,b)=>b.score-a.score).map(x=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #223247;padding:6px 0"><span>${esc(x.date)}</span><b>${x.score}</b></div>`).join('')}</div></section>`;h+=`<section class="section"><h2>🌍 거시·국제경제</h2><div class="macro">${(d.macro||[]).map(m=>`<div class="card"><b>${esc(m.title)}</b><div class="value">${esc(m.value)}</div><div class="muted">${esc(m.meaning)}</div></div>`).join('')}</div></section>`;document.getElementById('app').className='';document.getElementById('app').innerHTML=h;bind()}function bind(){document.querySelectorAll('#filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const f=b.dataset.f;document.querySelectorAll('.pickrow').forEach(r=>r.classList.toggle('hidden',f!=='all'&&r.dataset.theme!==f))});const inputs=[...document.querySelectorAll('.alloc input')];const recalc=()=>{let total=0;inputs.forEach(inp=>{const v=+inp.value||0,t=+inp.dataset.target||0;total+=v;localStorage.setItem('w:'+inp.dataset.key,v);const d=t-v,el=inp.parentElement.querySelector('.delta');el.textContent=(d>=0?'+':'')+d.toFixed(1)+'%p';el.className='delta '+(d>=0?'pos':'neg')});const t=document.getElementById('total');if(t){t.textContent=total.toFixed(1)+'%';t.style.color=Math.abs(total-100)<.11?'#4ade80':'#fde047'}};inputs.forEach(i=>i.oninput=recalc);recalc()}getData().then(render).catch(e=>{document.getElementById('status').textContent='OFFLINE';document.getElementById('app').innerHTML='<div class="notice">'+esc(e.message)+'</div>'});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
