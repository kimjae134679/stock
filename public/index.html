<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><link rel="manifest" href="manifest.webmanifest"><title>Market Radar</title><style>html,body{margin:0;width:100%;max-width:100vw;height:100%;background:#071018;color:#eaf2fb;font-family:system-ui;overflow:hidden;overscroll-behavior:none}#f{position:fixed;inset:0;width:100vw;max-width:100vw;height:100%;border:0;background:#071018;overflow:hidden}#status{position:fixed;right:30px;top:calc(env(safe-area-inset-top) + 44px);z-index:99;background:#0d1722ee;border:1px solid #45617e;border-radius:999px;padding:7px 11px;font-size:11px;line-height:1;font-weight:900;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.32)}@media(max-width:600px){#status{right:28px;top:calc(env(safe-area-inset-top) + 42px)}}</style></head><body><div id="status">SYNC</div><iframe id="f" title="Market Radar"></iframe><script>const REMOTE='https://kimjae134679.github.io/stock/reports/latest.html';const LOCAL='reports/latest.html';const f=document.getElementById('f'),s=document.getElementById('status');async function clearOldSW(){try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.filter(r=>r.scope.includes('/stock/')).map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.filter(k=>k.startsWith('market-radar-')).map(k=>caches.delete(k)))}}catch(_){}}function load(){if(navigator.onLine){f.src=REMOTE+'?v=14&shell='+Date.now();s.textContent='LIVE'}else{f.src=LOCAL+'?v=14';s.textContent='OFFLINE'}}window.addEventListener('online',load);window.addEventListener('offline',load);f.addEventListener('error',()=>{f.src=LOCAL+'?v=14';s.textContent='LOCAL'});clearOldSW().finally(load);</script></body></html>
